<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Form definition template</title>
  </head>
  <body>
    <!-- Build-time template only. Not included in the Vite publish directory. -->
    <form
      name="js-businesssuite-enquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="js-businesssuite-enquiry" />
      <input type="text" name="full_name" />
      <input type="text" name="email" />
      <input type="text" name="organisation" />
      <input type="text" name="description" />
      <input type="text" name="support_area" />
      <input type="text" name="phone" />
      <input type="text" name="contact_preference" />
      <input type="text" name="privacy_acknowledged" />
      <input type="text" name="buyer_segment" />
      <input type="text" name="buyer_problem" />
      <input type="text" name="service_interest" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
